name: Publish to npm

# The only workflow that publishes to npm. npm trusted publishing (OIDC) is
# bound to this file name, so every publish path lives here:
#   - workflow_run: after Test passes on main, bump the patch (or use a newer
#     explicit package.json version), commit, tag, push, then publish.
#   - push of a version tag, or workflow_dispatch: publish package.json as is.
# Never runs for the release commit itself (prevents recursion).
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: "npm-publish"
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[release]')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       !contains(github.event.workflow_run.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Calculate next patch tag
        if: github.event_name == 'workflow_run'
        id: semver
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [[ -z "$latest" ]]; then latest="0.0.0"; fi
          IFS='.' read -r major minor patch <<< "$latest"
          next_patch=$((patch + 1))
          candidate="${major}.${minor}.${next_patch}"
          # Respect an explicit newer package release (for example a major migration).
          package_version=$(node -p 'require("./package.json").version')
          if [[ "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] &&
             [[ "$package_version" != "$candidate" ]] &&
             [[ "$(printf '%s\n' "$candidate" "$package_version" | sort -V | tail -n 1)" == "$package_version" ]]; then
            candidate="$package_version"
            IFS='.' read -r major minor next_patch <<< "$candidate"
          fi
          # Skip to the next available patch tag if a rerun or collision occurs.
          while git rev-parse -q --verify "refs/tags/${candidate}" >/dev/null; do
            next_patch=$((next_patch + 1))
            candidate="${major}.${minor}.${next_patch}"
          done
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "next=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Bump package.json, commit, tag, push
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          next_tag="${{ steps.semver.outputs.next }}"
          latest_tag="${{ steps.semver.outputs.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          # Sync package.json version with the tag so `npm publish` ships the right version.
          npm pkg set version="$next_tag"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${next_tag} [release]"
          fi
          git tag -a "$next_tag" -m "ci: patch bump from ${latest_tag} to ${next_tag}"
          git push origin main --follow-tags

      - name: Install, test, publish
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm test
          npm publish --access public
